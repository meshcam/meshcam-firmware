; Radio test-mode firmware — SX1262 bench driver for the cert lab.
;
; Purpose: put the MeshCam radio section (SX1262 die — Core1262 on the bench today,
; E22-900M22S on the production board) into the emission modes a §15.247 DTS test lab
; needs, driven by simple serial commands. This is the "RF test-mode firmware" the FCC
; plan (homelab docs/trailcam/fcc-certification.md, option C module cert) lists as a
; production-commit deliverable; built now while the radio layer is warm.
;
; What it exposes over USB serial (115200), no packet stack, no RNS — just the radio:
;   - CW  : unmodulated carrier            (SX126x SetTxContinuousWave, 0xD1)
;   - MOD : modulated continuous, 100% duty (SX126x SetTxInfinitePreamble, 0xD2 —
;           continuous LoRa chirp = the DTS 6 dB occupied bandwidth the lab measures)
;   - PKT : back-to-back max-length packets (alternative 100%-duty modulated source)
;   - arbitrary FREQ / BW / SF / CR / PWR, fixed channel, hopping OFF (DTS is fixed-ch)
; Everything the lab drives for DTS bandwidth, PSD (8 dBm/3 kHz), peak conducted power,
; band-edge and the KDB 996369 D04 spurious/harmonic sweep.
;
;   pio run -e freenove-s3-radiotest              # compile
;   pio run -e freenove-s3-radiotest -t upload    # flash the bench board
;   pio device monitor -b 115200                  # then type: help
;
; SAFETY: this radiates continuously at up to +22 dBm. Bench it into a spectrum
; analyzer / tinySA through attenuation or a shielded fixture — not a bare antenna on
; the desk. See README.md.
;
; Radio bus defaults = the leaf PCB / gate-c radio pins (Core1262-HF jumpered on a
; Freenove ESP32-S3). TCXO 1.8 V on DIO3, DIO2 drives the RF switch (E22 + Core1262
; both). Override -D on the CLI for a different board.

[env:freenove-s3-radiotest]
framework       = arduino
platform        = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board           = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi      ; Freenove = WROOM-1 N16R8 (octal PSRAM)
board_upload.flash_size = 16MB
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder
build_type      = debug
lib_deps        = jgromes/RadioLib@^7.7.1
build_flags =
	-Wall
	-DBOARD_HAS_PSRAM
	; Radio bus (= leaf PCB / gate-c). Core1262-HF today; the E22-900M22S board
	; reuses the same SX1262 SPI + DIO2-RF-switch wiring.
	-DRADIO_SCLK_PIN=47 -DRADIO_MOSI_PIN=48 -DRADIO_MISO_PIN=38
	-DRADIO_CS_PIN=14 -DRADIO_RST_PIN=1 -DRADIO_BUSY_PIN=2 -DRADIO_DIO1_PIN=42
	; TCXO on DIO3 @ 1.8 V (e22-dossier.md: RadioLib defaults 1.6 — set explicitly)
	-DRADIO_TCXO_V=1.8
	; SX126x TX OCP: RadioLib's 60 mA default silently clamps +22 dBm — raise to 140 mA
	-DRADIO_OCP_MA=140
