; SD slot wiring probe — answers "does this board have the SD pull-up resistors?"
;
; Standalone on purpose: the gateway image is 1.5 MB and takes ~40 s to flash, this is
; ~250 KB and flashes in a few seconds, which matters when the test loop is "swap a
; card, reset, read". No secrets.ini, no network, no radio.
;
;   pio run -e sd-probe -t upload --upload-port <port-or-rfc2217-url>
;
; Findings live in homelab docs/trailcam/gateway-pcb.md ("Lessons from the
; T-Internet-POE").

[env:sd-probe]
platform  = espressif32@6.9.0
board     = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
	-DCORE_DEBUG_LEVEL=0
