; Gate C — W5500 SPI ethernet + SX1262 coexistence on ESP32-S3 (gateway-PCB de-risk).
;
; The gateway PCB (homelab docs/trailcam/gateway-pcb.md) is ESP32-S3 + W5500, replacing
; the T-Internet-POE's classic-ESP32 + LAN8720 RMII. W5500-through-the-ETH-API is the ONE
; unproven firmware path on that board; this gate proves it on owned hardware (Freenove
; ESP32-S3 + HiLetgo W5500 breakout, jumpered per the pin map below) BEFORE the schematic
; is committed. Everything above the netif (RNS-over-UDP, HTTPS ingest, OTA) is
; socket-level and already proven on the T-Internet-POE.
;
;   pio run -e freenove-s3-eth       -t upload   # W5500 only: link, DHCP, HTTP GET
;   pio run -e freenove-s3-eth-radio -t upload   # + SX1262 (Core1262) on the second SPI bus
;
; CORE VERSION IS THE POINT: SPI-ethernet (W5500) support in the Arduino ETH API landed in
; arduino-esp32 3.x. PlatformIO's own espressif32 platform is stuck on core 2.0.x, so this
; gate uses the pioarduino platform fork (the community continuation Espressif endorses).
; The production gateway/ tree will need the same core-3.x port when the PCB firmware env
; is added (the T-Internet-POE env pins espressif32@6.x for the OLD ETH.begin signature —
; that env stays as-is; LAN8720 keeps working there).
;
; Pin map = the gateway PCB GPIO draft, copied verbatim so the gate validates the real
; assignment (gateway-pcb.md "GPIO map draft"):
;   W5500 (own SPI bus): SCK 12  MISO 13  MOSI 11  CS 10  INT 9  RST 8
;   Radio (= leaf PCB):  SCK 47  MOSI 48  MISO 38  CS 14  RST 1  BUSY 2  DIO1 42
; The two buses are deliberately separate — RNS frame timing and ethernet DMA both hate
; arbitration; this gate exists to prove they don't fight anyway (IRQ latency, heap, WDT).

[env]
framework       = arduino
platform        = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board           = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi      ; Freenove = WROOM-1 N16R8 (octal PSRAM)
board_upload.flash_size = 16MB
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder
build_type      = debug
build_flags =
	-Wall
	-DBOARD_HAS_PSRAM
	; W5500 wiring (gateway PCB draft)
	-DETH_SCK_PIN=12 -DETH_MISO_PIN=13 -DETH_MOSI_PIN=11
	-DETH_CS_PIN=10  -DETH_INT_PIN=9   -DETH_RST_PIN=8
	; plain-HTTP probe target (any LAN-reachable or WAN URL; captive-portal
	; endpoints are handy because they answer tiny plaintext on :80)
	'-DTEST_URL="http://captive.apple.com/hotspot-detect.html"'

; W5500 only — flash THIS the day the breakout arrives. Proves: link up, DHCP,
; repeated HTTP GETs. No radio hardware needed.
[env:freenove-s3-eth]
build_flags =
	${env.build_flags}
	-DGATE_C_NO_RADIO

; + SX1262: Core1262-HF jumpered on the radio bus (TCXO on DIO3 @1.8 V, DIO2 = RF
; switch — same board case as gate-b / the T-Internet-POE hand-wiring). Radio sits in
; continuous RX and TXes a beacon every 10 s while the HTTP loop hammers the W5500.
[env:freenove-s3-eth-radio]
build_flags =
	${env.build_flags}
	-DRADIO_SCLK_PIN=47 -DRADIO_MOSI_PIN=48 -DRADIO_MISO_PIN=38
	-DRADIO_CS_PIN=14 -DRADIO_RST_PIN=1 -DRADIO_BUSY_PIN=2 -DRADIO_DIO1_PIN=42
lib_deps =
	jgromes/RadioLib @ ^7.0.0
