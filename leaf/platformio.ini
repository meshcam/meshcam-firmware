; Trail-cam LEAF — deep-sleep + PIR ext0 + timer wake, real camera capture, an INT8 TFLite
; false-trigger detector, and the persistent-identity RNS radio stack over a bare SX1262.
;
;   pio run -e freenove-s3        -t upload    # bench: 20 s test timer + camera + detector(gated) + radio
;   pio run -e freenove-s3-field  -t upload    # adaptive schedule; detector logs only (no gate)
;   pio run -e pin-monitor        -t upload    # lean diagnostic: characterize GPIO21, no radio/detector
;   pio device monitor -b 460800
;
; Wave a hand -> "cause=PIR (ext0)" -> capture -> detector (person=NN) -> (gated) send.
; Radio envs also bring up the SX1262 and print the STABLE leaf destination hash. OTA needs
; the 915 antenna. See README for the layer-by-layer hardware-validation log.

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi     ; match the leaf board (WROOM-1 N16R8)
board_upload.flash_size = 16MB
board_build.partitions = partitions_leaf.csv   ; 3MB app + ~12.9MB LittleFS full-res store
monitor_speed = 460800                          ; QXGA fulls must beat the bridge's 30s frame window
; Patch microReticulum's Transport::outbound/inbound single-thread deadlock in libdeps
; before each build (idempotent; no-op for the non-radio diagnostic envs). Found in Gate A
; (2026-07-02): ANY Resource retry re-enters outbound() from inside jobs() and the literal
; Python-lock translation spins forever. The leaf pushes thumbnails as Resources -> without
; this, one lost part wedges the leaf until power-cycle (no serial, no WDT: silent death).
extra_scripts =
	pre:patch_microreticulum.py
	; tflm_esp32 2.0.0 ships a flat mirror of its signal/ tree -> duplicate-symbol link
	; failure from a clean checkout; drop the mirror before compile (no version to pin to).
	pre:prune_tflm_dupes.py
monitor_filters = esp32_exception_decoder
build_flags =
	-Wall
	-DBOARD_HAS_PSRAM
	-DLEAF_PIR_GPIO=21
	; Build host's REAL UTC epoch for the clock seed (bug 6): the __DATE__ fallback
	; assumes an EDT build host and seeds 4 h fast on a UTC one — and a fast seed
	; wedges the gateway's announce replay guard after the corrective time sync.
	!python3 -c "import time; print('-DLEAF_BUILD_EPOCH={}LL'.format(int(time.time())))"

; --- radio stack (SX1262 + microReticulum) — referenced by the field-capable envs -------
; LEAF_RADIO gates leaf_radio.* + the LoRaInterface (lib/). Pins match the leaf GPIO budget
; (docs) and the gate-b radio map.
[radio]
build_flags =
	-Wno-format
	-DRNS_USE_FS
	; RAM hashlist (2026-07-19): the persistent replay-guard store did TWO synchronous
	; flash writes per accepted packet INSIDE radio dispatch — latency stacked exactly
	; where contention losses live (and the leaf shares that LittleFS with the photo
	; ring; its compaction threw "Has open FD" unlink errors). Wear was fine (~century);
	; the fsyncs were not. Cost of RAM-only: a reboot forgets the replay window, so a
	; stale announce can reprocess ONCE post-boot — benign, handlers are idempotent.
	-DRNS_PERSIST_HASHLIST=0
	-DUSTORE_USE_UNIVERSALFS
	-DMCU_ESP32
	-DMSGPACK_USE_BOOST=OFF
	-DLEAF_RADIO
	-DGATE_B_WIRED_SX1262
	; MISO is per-env: bench Freenove = 41 (its SD slot owns 38/39/40); custom
	; PCB = 38 (dedicated SD CS on 43, BME280 on its own I2C 40/41).
	-DRADIO_SCLK_PIN=47 -DRADIO_MOSI_PIN=48
	-DRADIO_CS_PIN=14 -DRADIO_RST_PIN=1 -DRADIO_BUSY_PIN=2 -DRADIO_DIO1_PIN=42
	; The gateway (gateway-heltec) destination hash the alert thumbnail is pushed to as
	; an RNS::Resource — same trailcam_gatea.resource destination the surveyor's
	; candidate list holds. Empty/absent = announce-only.
	;
	; ⚠️ It DOES rotate, and there is NO fallback: establish_gateway_link() returns
	; false on a hash that has no path, so a stale value here means a leaf that never
	; uploads. It is not only a filesystem erase that rotates it — a new BOARD mints a
	; new identity, so this value outlives the hardware it names. History:
	; b78747ea… → 6d3d3467… (before 2026-08-06) → e717410e… on 2026-08-08, when the
	; home Heltec died with a hard short across 3V3 and was replaced
	; (homelab docs/trailcam/home-gateway-outage-2026-08-08.md).
	; Verify against the replacement's own boot log ("[gw] GATEWAY destination hash: …")
	; or the gateway's /debuglog ("… DROPPED: destination registered LOCAL" is the
	; gateway seeing its own relayed announce).
	; NOTE: this points at the HOME bench gateway. A leaf deployed at the north40
	; wants the tower node, 8e2bddb9b0c3a909b28d54829959dbbe.
	'-DLEAF_GATEWAY_DEST_HEX="e717410e062217170f199161a6c7b69a"'
lib_deps =
	ArduinoJson@^7.4.2
	MsgPack@^0.4.2
	jgromes/RadioLib @ ^7.0.0
	https://github.com/attermann/Crypto.git
	https://github.com/attermann/microStore.git
	; pinned to the SHA Gate A validated on hardware (Resource + deadlock patch proven)
	https://github.com/attermann/microReticulum.git#c02b6e3d985567cced4450fb65902106ebda5a39

; --- detector (INT8 TFLite-micro person_detection) — the false-trigger filter -----------
; LEAF_DETECTOR gates the leaf_detector lib (in lib/, model vendored there) + its calls.
; tflm_esp32 is the ESP-NN-accelerated TFLite-micro runtime. LEAF_DETECT_GATE (bench only)
; makes a "no subject" verdict actually SKIP the send so the model is visibly working; leave
; it unset in the field until a multi-class deer/person model replaces person-only.
[detector]
build_flags =
	-DLEAF_DETECTOR
lib_deps =
	eloquentarduino/tflm_esp32@^2.0.0

[env:freenove-s3]
build_flags =
	${env.build_flags}
	${radio.build_flags}
	-DRADIO_MISO_PIN=41
	${detector.build_flags}
	; NO LEAF_DETECT_GATE (removed 2026-07-03): the person model returned "no subject"
	; on a real walk-by (send=0) and silently ate the alert — the exact failure the field
	; env's comment predicted. Score stays as metadata; gating waits for a model that's
	; proven against real captures.
	-DLEAF_TEST_INTERVAL_S=20     ; short timer so bench wakes are watchable
	; bench, CARDLESS-fallback ring only (with an SD card there's no eviction at all):
	; desk motion fires a capture every ~25 s; at QXGA ~130 KB/full, 64 slots (~8.5 MB of
	; the 12.9 MB partition) give ~25 min of retention so a photo survives long enough to
	; 📡-request. The conservative default (4) stays for the field env.
	-DLEAF_STORE_MAX_FULL=64
	; NOTE: there is deliberately NO "live capture fallback" for fetch_full of an
	; unstored event — a full-res from a different moment corrupts the photo record
	; (verified bug 2026-07-02, dev photo 93487506). Missing = ignore, expires server-side.
lib_deps =
	${radio.lib_deps}
	${detector.lib_deps}

[env:freenove-s3-field]
build_flags =
	${env.build_flags}
	${radio.build_flags}
	-DRADIO_MISO_PIN=41
	${detector.build_flags}
	; no LEAF_DETECT_GATE -> detector logs the score but never suppresses (safe for animals)
	; no LEAF_TEST_INTERVAL_S -> real adaptive schedule (needs gateway time sync)
	; TX power: 14 dBm field default from the 2026-07-18 sweep (homelab
	; docs/trailcam/leaf-tx-power.md) — on perfboard power delivery the curve
	; INVERTS above 14 (17 reads −2.7 dB, 20/22 lose 12/23% of announces to TX
	; sag). Raise only after the target board proves >14 on ITS OWN sweep.
	-DLORA_TX_DBM=14
lib_deps =
	${radio.lib_deps}
	${detector.lib_deps}

; Diagnostic only: characterize the PIR line on GPIO21. No sleep, no camera, no radio, no
; detector (stays lean).
[env:pin-monitor]
lib_ignore = lora_interface, leaf_detector
build_flags =
	${env.build_flags}
	-DLEAF_PIN_MONITOR

; Diagnostic only: isolate the microSD (mount/write/read loop, no sleep/camera/radio).
; BENCH FREENOVE — SD_MMC on the Freenove slot pins. For the custom PCB use
; leaf-pcb-sd-probe below; its card is SPI mode on entirely different pins.
[env:sd-probe]
lib_ignore = lora_interface, leaf_detector
build_flags =
	${env.build_flags}
	-DLEAF_SD_PROBE

; Diagnostic only: the CUSTOM LEAF PCB's microSD (SPI mode, CS 43 on the shared radio
; bus). Measures whether the SD lines actually have their pull-ups — with the switched
; rail off AND on, since the 10k CS pull-up hangs off LORA_3V3 — then mounts and does a
; write/readback. Exists because the gateway board turned out to be missing exactly one
; pull-up on its data line, and the leaf's microSD has never been brought up (step 3 of
; the 9-step gate) while its v1.0 respin is still open. Console is native USB-CDC.
; Queue acceptance gates against the REAL queue code (gateway/src/sd_queue.inc compiled
; here with SDQ_FS=SD). Lives on the leaf because the gateway board's TF slot is missing
; its D0 pull-up and cannot mount a card at all. The queue tunables are shrunk so the
; eviction gate trips in seconds instead of needing ~59 GB of writes — the logic under
; test is unchanged. Does NOT cover gate 4 (empty-slot containment is SD_MMC-only) or the
; HTTP upload half; both are gateway-side.
[env:leaf-pcb-sdq-gates]
lib_ignore = lora_interface, leaf_detector
build_flags =
	${env.build_flags}
	-DLEAF_SDQ_GATES
	-DGW_SDQ_MAX_FILES=24
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DRADIO_SCLK_PIN=47
	-DRADIO_MOSI_PIN=48
	-DRADIO_MISO_PIN=38
	-DLEAF_CAM_PWR_GPIO=39
	-DLEAF_RADIO_PWR_GPIO=44
	-DLEAF_SD_SPI_CS=43

; WIRE FORMAT test: posts REAL multipart bodies (gateway/src/sd_queue_upload.inc — the
; actual ConcatStream + upload_body) at a probe server that checks every byte. The other
; gate env injects upload OUTCOMES, which proves what the gateway DOES with a 2xx/4xx but
; not that the bytes are right; this is the only way to check Content-Length, the boundary
; and the file payload.
;
; CREDENTIALS ARE NOT WIRED IN HERE ON PURPOSE. Adding 'extra_configs = secrets.ini' to
; this project would make EVERY leaf env unbuildable for anyone without that file, and the
; leaf has never needed one. Pass them at build time instead:
;   PLATFORMIO_BUILD_FLAGS="-DGW_WIFI_SSID='\"..\"' -DGW_WIFI_PSK='\"..\"' \
;                           -DGW_INGEST_TOKEN='\"..\"'" pio run -e leaf-pcb-sdq-wire
; (the gateway's secrets.ini already holds all three). The URL below points at the probe
; server rather than the real backend.
;   server: scratchpad/ingest_probe_server.py, run on your workstation. Point the URL
;   below at whatever host that is.
[env:leaf-pcb-sdq-wire]
lib_ignore = lora_interface, leaf_detector
build_flags =
	${env.build_flags}
	-DLEAF_SDQ_WIRE
	-DGW_INGEST_URL="\"https://probe-server.local:8443/api/v1/ingest\""
	-DGW_SITE="\"leaf-wire-test\""
	-DGW_SDQ_MAX_FILES=24
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DRADIO_SCLK_PIN=47
	-DRADIO_MOSI_PIN=48
	-DRADIO_MISO_PIN=38
	-DLEAF_CAM_PWR_GPIO=39
	-DLEAF_RADIO_PWR_GPIO=44
	-DLEAF_SD_SPI_CS=43

; microSD THROUGHPUT bench on the v0.6 PCB: SPI mode at 4/20/40 MHz vs SDMMC
; 1-bit on the same three board traces (the S3 routes SDMMC through the GPIO matrix, so
; the SPI-wired lines can be re-driven as CLK/CMD/D0), with a full rail power cycle before
; every mount because a card latches into SPI mode until it loses power. Feeds the v1.0
; routing "is 4-bit worth two scarce GPIOs" call. 4-bit itself is NOT measurable
; here — v0.6 does not route DAT1/DAT2. Console is native USB-CDC; run takes ~3 min.
;   pio run -e leaf-pcb-sd-bench
[env:leaf-pcb-sd-bench]
lib_ignore = lora_interface, leaf_detector
build_flags =
	${env.build_flags}
	-DLEAF_SD_BENCH
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	; leaf_store.cpp compiles in and shares this bus, so it needs the full SPI trio.
	-DRADIO_SCLK_PIN=47
	-DRADIO_MOSI_PIN=48
	-DRADIO_MISO_PIN=38
	-DLEAF_CAM_PWR_GPIO=39
	-DLEAF_RADIO_PWR_GPIO=44
	-DLEAF_SD_SPI_CS=43

[env:leaf-pcb-sd-probe]
lib_ignore = lora_interface, leaf_detector
build_flags =
	${env.build_flags}
	-DLEAF_SD_PCB_PROBE
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	; leaf_store.cpp compiles in and shares this bus, so it needs the full SPI trio —
	; same values as [radio], MISO=38 for the PCB (the bench Freenove uses 41).
	-DRADIO_SCLK_PIN=47
	-DRADIO_MOSI_PIN=48
	-DRADIO_MISO_PIN=38
	-DLEAF_CAM_PWR_GPIO=39
	-DLEAF_RADIO_PWR_GPIO=44
	-DLEAF_SD_SPI_CS=43

; --- custom leaf PCB (pilot, v0.5.x, JLC fab v6) -----------------------------------------
; Console is the S3's NATIVE USB (no UART bridge on the board): CDC flags below. Switched
; power rails (leaf_rails.h): IO39 camera, IO44 radio+microSD — firmware drives them LOW to
; power, and the board's pull-ups hold them OFF through deep sleep. SD is SPI mode CS=43 on
; the shared radio bus. BME280 module in J10 (I2C 40/41 @0x76). Battery divider on IO3.
; Radio = socketed Core1262 (same TCXO/profile as bench). Deep-sleep target: <50 uA.
[env:leaf-pcb]
build_flags =
	${env.build_flags}
	${radio.build_flags}
	${detector.build_flags}
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DRADIO_MISO_PIN=38
	-DLEAF_CAM_PWR_GPIO=39
	-DLEAF_RADIO_PWR_GPIO=44
	-DLEAF_SD_SPI_CS=43
	-DLEAF_VBAT_ADC_GPIO=3
	-DLEAF_BME280
	-DLEAF_TEST_INTERVAL_S=20
	-DLEAF_STORE_MAX_FULL=64
lib_deps =
	${radio.lib_deps}
	${detector.lib_deps}
	adafruit/Adafruit BME280 Library@^2.2.4

[env:leaf-pcb-field]
build_flags =
	${env.build_flags}
	${radio.build_flags}
	${detector.build_flags}
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	; 14 dBm: perfboard-derived safe floor (leaf-tx-power.md). The PCB's power
	; path likely supports more — pending its own on-battery sweep.
	-DLORA_TX_DBM=14
	-DRADIO_MISO_PIN=38
	-DLEAF_CAM_PWR_GPIO=39
	-DLEAF_RADIO_PWR_GPIO=44
	-DLEAF_SD_SPI_CS=43
	-DLEAF_VBAT_ADC_GPIO=3
	-DLEAF_BME280
lib_deps =
	${radio.lib_deps}
	${detector.lib_deps}
	adafruit/Adafruit BME280 Library@^2.2.4
