; Trail-cam LEAF — deep-sleep + PIR ext0 + timer wake, real camera capture, an INT8 TFLite
; false-trigger detector, and the persistent-identity RNS radio stack over a bare SX1262.
;
;   pio run -e freenove-s3        -t upload    # bench: 20 s test timer + camera + detector(gated) + radio
;   pio run -e freenove-s3-field  -t upload    # adaptive schedule; detector logs only (no gate)
;   pio run -e pin-monitor        -t upload    # lean diagnostic: characterize GPIO21, no radio/detector
;   pio device monitor -b 460800
;
; Wave a hand -> "cause=PIR (ext0)" -> capture -> detector (person=NN) -> (gated) send.
; Radio envs also bring up the SX1262 and print the STABLE leaf destination hash. OTA needs
; the 915 antenna. See README for the layer-by-layer hardware-validation log.

[env]
; EXACT pioarduino release (Arduino core 3.3.9 / IDF 5.5.4), pinned by URL on purpose
;. A bare `platform = espressif32` does NOT mean pioarduino: it resolves to
; whatever platform already occupies ~/.platformio/platforms/espressif32 — and on a
; fresh host that is platformio/espressif32 7.x (Arduino core 2.x lineage), which
; this firmware does not build against (NimBLE-backed BLE etc. are core 3.3.9
; features). It only ever worked because the pioarduino zip happened to be installed
; first on the dev host. Bump this URL and the matching pins in gateway/ and
; surveyor/ together.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi     ; match the leaf board (WROOM-1 N16R8)
board_upload.flash_size = 16MB
board_build.partitions = partitions_leaf.csv   ; 3MB app + ~12.9MB LittleFS full-res store
monitor_speed = 460800                          ; QXGA fulls must beat the bridge's 30s frame window
; Patch microReticulum's Transport::outbound/inbound single-thread deadlock in libdeps
; before each build (idempotent; no-op for the non-radio diagnostic envs). Found in Gate A
; (2026-07-02): ANY Resource retry re-enters outbound() from inside jobs() and the literal
; Python-lock translation spins forever. The leaf pushes thumbnails as Resources -> without
; this, one lost part wedges the leaf until power-cycle (no serial, no WDT: silent death).
extra_scripts =
	pre:patch_microreticulum.py
	; tflm_esp32 2.0.0 ships a flat mirror of its signal/ tree -> duplicate-symbol link
	; failure from a clean checkout; drop the mirror before compile (no version to pin to).
	pre:prune_tflm_dupes.py
monitor_filters = esp32_exception_decoder
build_flags =
	-Wall
	-DBOARD_HAS_PSRAM
	-DLEAF_PIR_GPIO=21
	; Build host's REAL UTC epoch for the clock seed (bug 6): the __DATE__ fallback
	; assumes an EDT build host and seeds 4 h fast on a UTC one — and a fast seed
	; wedges the gateway's announce replay guard after the corrective time sync.
	!python3 -c "import time; print('-DLEAF_BUILD_EPOCH={}LL'.format(int(time.time())))"

; --- RNS stack, transport-independent — do not reference directly from an env ----------
; LEAF_RADIO gates leaf_radio.* + the LoRaInterface (lib/). Everything here is true of
; both PHY backends below; only [radio] / [radio_rak] differ, and an env picks exactly one.
[rns]
build_flags =
	-Wno-format
	-DRNS_USE_FS
	; RAM hashlist (2026-07-19): the persistent replay-guard store did TWO synchronous
	; flash writes per accepted packet INSIDE radio dispatch — latency stacked exactly
	; where contention losses live (and the leaf shares that LittleFS with the photo
	; ring; its compaction threw "Has open FD" unlink errors). Wear was fine (~century);
	; the fsyncs were not. Cost of RAM-only: a reboot forgets the replay window, so a
	; stale announce can reprocess ONCE post-boot — benign, handlers are idempotent.
	-DRNS_PERSIST_HASHLIST=0
	-DUSTORE_USE_UNIVERSALFS
	-DMCU_ESP32
	-DMSGPACK_USE_BOOST=OFF
	-DLEAF_RADIO
	; The gateway (gateway-heltec) destination hash the alert thumbnail is pushed to as
	; an RNS::Resource — same trailcam_gatea.resource destination the surveyor's
	; candidate list holds. Empty/absent = announce-only.
	;
	; ⚠️ It DOES rotate, and there is NO fallback: establish_gateway_link() returns
	; false on a hash that has no path, so a stale value here means a leaf that never
	; uploads. It is not only a filesystem erase that rotates it — a new BOARD mints a
	; new identity, so this value outlives the hardware it names. History:
	; b78747ea… → 6d3d3467… (before 2026-08-06) → e717410e… on 2026-08-08, when the
	; home Heltec died with a hard short across 3V3 and was replaced
	; (homelab docs/trailcam/home-gateway-outage-2026-08-08.md).
	; Verify against the replacement's own boot log ("[gw] GATEWAY destination hash: …")
	; or the gateway's /debuglog ("… DROPPED: destination registered LOCAL" is the
	; gateway seeing its own relayed announce).
	; NOTE: this points at the HOME bench gateway. A leaf deployed at the north40
	; wants the tower node, 8e2bddb9b0c3a909b28d54829959dbbe.
	'-DLEAF_GATEWAY_DEST_HEX="e717410e062217170f199161a6c7b69a"'
lib_deps =
	ArduinoJson@^7.4.2
	MsgPack@^0.4.2
	jgromes/RadioLib @ ^7.0.0
	https://github.com/attermann/Crypto.git
	https://github.com/attermann/microStore.git
	; pinned to the SHA Gate A validated on hardware (Resource + deadlock patch proven)
	https://github.com/attermann/microReticulum.git#c02b6e3d985567cced4450fb65902106ebda5a39

; --- PHY backend A: bare SX1262 over SPI (v0.x leaf PCBs, bench Freenove/Heltec) --------
; Pins match the leaf GPIO budget (docs) and the gate-b radio map.
[radio]
build_flags =
	${rns.build_flags}
	-DGATE_B_WIRED_SX1262
	; MISO is per-env: bench Freenove = 41 (its SD slot owns 38/39/40); custom
	; PCB = 38 (dedicated SD CS on 43, BME280 on its own I2C 40/41).
	-DRADIO_SCLK_PIN=47 -DRADIO_MOSI_PIN=48
	-DRADIO_CS_PIN=14 -DRADIO_RST_PIN=1 -DRADIO_BUSY_PIN=2 -DRADIO_DIO1_PIN=42
lib_deps =
	${rns.lib_deps}

; --- PHY backend B: RAK3172-T over UART, RUI3 AT commands (leaf PCB v1.0) ---------------
; The v1.0 board has NO SX1262 and no SPI radio bus: U9 is a soldered RAK3172-T module on
; UART2, and those same GPIOs changed meaning (respin spec §11 firmware contract):
;   IO14 -> RAK UART TX   [was LORA_NSS]     IO1  -> RAK NRST   [was LORA_RST]
;   IO2  <- RAK UART RX   [was LORA_BUSY]    IO42 -> RAK BOOT0  [was LORA_DIO1]
; The module holds the §15.247 grant the product rides and refuses >22 dBm itself.
; Transport mechanics (one-shot RX, exclusive TX/RX, preamble 20): Rak3172Modem.h.
[radio_rak]
build_flags =
	${rns.build_flags}
	-DLORA_BACKEND_RAK3172
	-DRAK_UART_TX_PIN=14 -DRAK_UART_RX_PIN=2
	-DRAK_NRST_PIN=1 -DRAK_BOOT0_PIN=42
lib_deps =
	${rns.lib_deps}

; --- detector (INT8 TFLite-micro person_detection) — the false-trigger filter -----------
; LEAF_DETECTOR gates the leaf_detector lib (in lib/, model vendored there) + its calls.
; tflm_esp32 is the ESP-NN-accelerated TFLite-micro runtime. LEAF_DETECT_GATE (bench only)
; makes a "no subject" verdict actually SKIP the send so the model is visibly working; leave
; it unset in the field until a multi-class deer/person model replaces person-only.
[detector]
build_flags =
	-DLEAF_DETECTOR
lib_deps =
	eloquentarduino/tflm_esp32@^2.0.0

; Env sensor (J10) — all three parts a "BME280" listing actually ships. leaf_env.cpp
; picks one at runtime from chip-id 0xD0, so all three drivers ship in the binary; the
; BME680 library is here for Bosch's bme68x.c, which leaf_env drives directly.
[env_sensor]
lib_deps =
	adafruit/Adafruit BME280 Library@^2.2.4
	adafruit/Adafruit BMP280 Library@^2.6.8
	adafruit/Adafruit BME680 Library@^2.0.4

[env:freenove-s3]
build_flags =
	${env.build_flags}
	${radio.build_flags}
	-DRADIO_MISO_PIN=41
	${detector.build_flags}
	; NO LEAF_DETECT_GATE (removed 2026-07-03): the person model returned "no subject"
	; on a real walk-by (send=0) and silently ate the alert — the exact failure the field
	; env's comment predicted. Score stays as metadata; gating waits for a model that's
	; proven against real captures.
	-DLEAF_TEST_INTERVAL_S=20     ; short timer so bench wakes are watchable
	; bench, CARDLESS-fallback ring only (with an SD card there's no eviction at all):
	; desk motion fires a capture every ~25 s; at QXGA ~130 KB/full, 64 slots (~8.5 MB of
	; the 12.9 MB partition) give ~25 min of retention so a photo survives long enough to
	; 📡-request. The conservative default (4) stays for the field env.
	-DLEAF_STORE_MAX_FULL=64
	; NOTE: there is deliberately NO "live capture fallback" for fetch_full of an
	; unstored event — a full-res from a different moment corrupts the photo record
	; (verified bug 2026-07-02, dev photo 93487506). Missing = ignore, expires server-side.
lib_deps =
	${radio.lib_deps}
	${detector.lib_deps}

; --- BLE walk-up access ------------------------------------------------------------------
; NimBLE, NOT Bluedroid — and on this toolchain that is not a choice we make, it is the
; only option: arduino-esp32 3.3.9 ships libbt.a built CONFIG_BT_NIMBLE_ENABLED=y with
; CONFIG_BLUEDROID_ENABLED unset, and the bundled `BLE` library (BLEDevice.h) is the
; NimBLE-backed rewrite. So there is NO external lib_deps entry here: including
; <BLEDevice.h> IS using NimBLE. (Adding h2zero/NimBLE-Arduino on top would duplicate the
; same host and is what a naive port does.)
[ble]
build_flags =
	-DLEAF_BLE
	; MANDATORY alongside BLE, not a tuning knob. The detector's default arena lives in
	; INTERNAL SRAM and costs 172 KB of it; measured on the bench 2026-08-17 that leaves
	; ~54 KB free once RNS is up and nimble_port_init() then fails outright ("hci inits
	; failed", rc=-1). Moving the arena to PSRAM costs 4 ms on a 4141 ms inference (0.1%,
	; leaf_detector.cpp's own number) and hands BLE the ~172 KB it needs.
	-DLEAF_DETECT_ARENA_PSRAM
	; Walk-up service window: a PIR wake advertises for this many seconds so a
	; phone walking up can find the node. Only meaningful with BLE, so it is set here and
	; nowhere else — every non-BLE env leaves it at 0 (feature compiled out).
	; 30 s is a GUESS at "long enough to open the app", not a measurement. The per-window
	; cost is unmeasured until the PPK2 lands.
	-DLEAF_WALKUP_WINDOW_S=30
	; LEAF_LOCKOUT_KEEP_PIR is deliberately NOT set: whether a node on a nearly-flat cell
	; should still answer a walk-up is a deployment choice, not a default. See lowbatt_sleep().

; freenove-s3 + BLE. This env exists to be MEASURED against plain freenove-s3: identical
; sources and flags but for -DLEAF_BLE, so the flash and static-RAM diff between the two
; is the honest cost of the BLE stack against the 3 MB dual-OTA app slot (partitions_leaf.csv
; — app0/app1 are 0x300000 each, so the 16 MB part gives 3 MB, not 16). It is also a real
; firmware: BLE comes up during the maintenance window and hands off to WiFi on command.
[env:freenove-s3-ble]
build_flags =
	${env.build_flags}
	${radio.build_flags}
	-DRADIO_MISO_PIN=41
	${detector.build_flags}
	${ble.build_flags}
	-DLEAF_TEST_INTERVAL_S=20
	-DLEAF_STORE_MAX_FULL=64
lib_deps =
	${radio.lib_deps}
	${detector.lib_deps}

; Bench harness for the RUNTIME half of the kill-gate (items 2-5): free heap,
; free PSRAM, a real GATT connection from a phone, and the sequential BLE->WiFi->BLE
; handoff, all with camera + RNS + TFLite live. Stays awake instead of deep-sleeping —
; you cannot stand in front of a board with a phone in a 3 s wake window. src/ble_fit.inc
; documents the method and what it deliberately does not cover.
;
; To make the handoff join a REAL AP rather than falling back to SoftAP, put the bench
; SSID in the gitignored leaf/src/wire_secrets.h as GW_WIFI_SSID2/GW_WIFI_PSK2 (the
; same header sdq_wire.inc and cam_bakeoff.inc read); ble_fit.inc picks it up on its
; own. Do NOT pass creds as -D flags — they land on every compiler invocation's ARGV,
; where ps can read them and a compiler error echoes them verbatim.
; Without them the harness brings up a SoftAP instead, which exercises the same driver on
; the same radio and is the fallback design anyway — the run is still valid.
[env:freenove-s3-ble-fit]
build_flags =
	${env.build_flags}
	${radio.build_flags}
	-DRADIO_MISO_PIN=41
	${detector.build_flags}
	${ble.build_flags}
	-DLEAF_BLE_FIT
	-DLEAF_BLE_FIT_WAIT_S=180
lib_deps =
	${radio.lib_deps}
	${detector.lib_deps}

[env:freenove-s3-field]
build_flags =
	${env.build_flags}
	${radio.build_flags}
	-DRADIO_MISO_PIN=41
	${detector.build_flags}
	; no LEAF_DETECT_GATE -> detector logs the score but never suppresses (safe for animals)
	; no LEAF_TEST_INTERVAL_S -> real adaptive schedule (needs gateway time sync)
	; TX power: 14 dBm field default from the 2026-07-18 sweep (homelab
	; docs/trailcam/leaf-tx-power.md) — on perfboard power delivery the curve
	; INVERTS above 14 (17 reads −2.7 dB, 20/22 lose 12/23% of announces to TX
	; sag). Raise only after the target board proves >14 on ITS OWN sweep.
	-DLORA_TX_DBM=14
lib_deps =
	${radio.lib_deps}
	${detector.lib_deps}

; Camera module BAKE-OFF harness (homelab docs/trailcam/camera-bakeoff.md): bench
; Freenove S3 with each candidate DVP module on the ribbon. Stays awake, inits the module,
; reports PID + the driver's max framesize, grabs at the sensor's OWN ceiling (no
; LEAF_FULL_FRAMESIZE assumption — the leaf default is the OV3660's QXGA, above the OV2640's
; UXGA), and serves /jpg /stream /set /load /reinit over WiFi (STA from wire_secrets.h,
; SoftAP fallback) plus a base64-over-serial fallback. See src/cam_bakeoff.inc.
;   pio run -e cam-bakeoff -t upload
[env:cam-bakeoff]
lib_ignore = lora_interface, leaf_detector
build_flags =
	${env.build_flags}
	-DLEAF_CAM_BAKEOFF

; Diagnostic only: characterize the PIR line on GPIO21. No sleep, no camera, no radio, no
; detector (stays lean).
[env:pin-monitor]
lib_ignore = lora_interface, leaf_detector
build_flags =
	${env.build_flags}
	-DLEAF_PIN_MONITOR

; Diagnostic only: isolate the microSD (mount/write/read loop, no sleep/camera/radio).
; BENCH FREENOVE — SD_MMC on the Freenove slot pins. For the custom PCB use
; leaf-pcb-sd-probe below; its card is SPI mode on entirely different pins.
[env:sd-probe]
lib_ignore = lora_interface, leaf_detector
build_flags =
	${env.build_flags}
	-DLEAF_SD_PROBE

; Diagnostic only: the CUSTOM LEAF PCB's microSD (SPI mode, CS 43 on the shared radio
; bus). Measures whether the SD lines actually have their pull-ups — with the switched
; rail off AND on, since the 10k CS pull-up hangs off LORA_3V3 — then mounts and does a
; write/readback. Exists because the gateway board turned out to be missing exactly one
; pull-up on its data line, and the leaf's microSD has never been brought up (step 3 of
; the 9-step gate) while its v1.0 respin is still open. Console is native USB-CDC.
; Queue acceptance gates against the REAL queue code (gateway/src/sd_queue.inc compiled
; here with SDQ_FS=SD). Lives on the leaf because the gateway board's TF slot is missing
; its D0 pull-up and cannot mount a card at all. The queue tunables are shrunk so the
; eviction gate trips in seconds instead of needing ~59 GB of writes — the logic under
; test is unchanged. Does NOT cover gate 4 (empty-slot containment is SD_MMC-only) or the
; HTTP upload half; both are gateway-side.
[env:leaf-pcb-sdq-gates]
lib_ignore = lora_interface, leaf_detector
build_flags =
	${env.build_flags}
	-DLEAF_SDQ_GATES
	-DGW_SDQ_MAX_FILES=24
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DRADIO_SCLK_PIN=47
	-DRADIO_MOSI_PIN=48
	-DRADIO_MISO_PIN=38
	-DLEAF_CAM_PWR_GPIO=39
	-DLEAF_RADIO_PWR_GPIO=44
	-DLEAF_SD_SPI_CS=43

; WIRE FORMAT test: posts REAL multipart bodies (gateway/src/sd_queue_upload.inc — the
; actual ConcatStream + upload_body) at a probe server that checks every byte. The other
; gate env injects upload OUTCOMES, which proves what the gateway DOES with a 2xx/4xx but
; not that the bytes are right; this is the only way to check Content-Length, the boundary
; and the file payload.
;
; CREDENTIALS AND THE TARGET URL ARE NOT WIRED IN HERE ON PURPOSE. Adding
; 'extra_configs = secrets.ini' to this project would make EVERY leaf env unbuildable for
; anyone without that file, and the leaf has never needed one. They live in the gitignored
; header leaf/src/wire_secrets.h, which sdq_wire.inc includes ahead of the queue sources:
; GW_WIFI_SSID/PSK, GW_WIFI_SSID2/PSK2, GW_INGEST_TOKEN and GW_INGEST_URL. A header rather
; than -D flags on the build command line, because flags got echoed verbatim by a compiler
; error on 2026-08-09. Regenerate it from the gateway's secrets.ini; never commit it.
;
; GW_INGEST_URL must point at the probe server, NOT the real backend:
;   server: scratchpad/ingest_probe_server.py, run on your workstation
[env:leaf-pcb-sdq-wire]
lib_ignore = lora_interface, leaf_detector
build_flags =
	${env.build_flags}
	-DLEAF_SDQ_WIRE
	-DGW_SITE="\"leaf-wire-test\""
	-DGW_SDQ_MAX_FILES=24
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DRADIO_SCLK_PIN=47
	-DRADIO_MOSI_PIN=48
	-DRADIO_MISO_PIN=38
	-DLEAF_CAM_PWR_GPIO=39
	-DLEAF_RADIO_PWR_GPIO=44
	-DLEAF_SD_SPI_CS=43

; microSD THROUGHPUT bench on the v0.6 PCB: SPI mode at 4/20/40 MHz vs SDMMC
; 1-bit on the same three board traces (the S3 routes SDMMC through the GPIO matrix, so
; the SPI-wired lines can be re-driven as CLK/CMD/D0), with a full rail power cycle before
; every mount because a card latches into SPI mode until it loses power. Feeds the v1.0
; routing "is 4-bit worth two scarce GPIOs" call. 4-bit itself is NOT measurable
; here — v0.6 does not route DAT1/DAT2. Console is native USB-CDC; run takes ~3 min.
;   pio run -e leaf-pcb-sd-bench
[env:leaf-pcb-sd-bench]
lib_ignore = lora_interface, leaf_detector
build_flags =
	${env.build_flags}
	-DLEAF_SD_BENCH
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	; leaf_store.cpp compiles in and shares this bus, so it needs the full SPI trio.
	-DRADIO_SCLK_PIN=47
	-DRADIO_MOSI_PIN=48
	-DRADIO_MISO_PIN=38
	-DLEAF_CAM_PWR_GPIO=39
	-DLEAF_RADIO_PWR_GPIO=44
	-DLEAF_SD_SPI_CS=43

[env:leaf-pcb-sd-probe]
lib_ignore = lora_interface, leaf_detector
build_flags =
	${env.build_flags}
	-DLEAF_SD_PCB_PROBE
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	; leaf_store.cpp compiles in and shares this bus, so it needs the full SPI trio —
	; same values as [radio], MISO=38 for the PCB (the bench Freenove uses 41).
	-DRADIO_SCLK_PIN=47
	-DRADIO_MOSI_PIN=48
	-DRADIO_MISO_PIN=38
	-DLEAF_CAM_PWR_GPIO=39
	-DLEAF_RADIO_PWR_GPIO=44
	-DLEAF_SD_SPI_CS=43

[env:leaf-pcb-bme-probe]
; BME280 (J10) bring-up: I2C scan + continuous T/RH/P on the native USB console, no sleep.
lib_ignore = lora_interface, leaf_detector
lib_deps = ${env_sensor.lib_deps}
build_flags =
	${env.build_flags}
	-DLEAF_BME_PROBE
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DLEAF_CAM_PWR_GPIO=39
	-DLEAF_RADIO_PWR_GPIO=44

[env:leaf-pcb-v1-probe]
; v1.0 FIRST-ARTICLE overnight probe (board serial 0015 = MAC 44:B1:76:A6:A3:B8, first
; powered 2026-08-28). Never sleeps (USB soak + headless reflash stays possible); cycles
; the LORA rail and queries the soldered RAK3172 read-only (NOTHING that keys the PA — no
; antenna on the bench); SDMMC 1-bit mount (CLK=47 CMD=48 D0=38); camera capture ladder
; QVGA->SVGA->UXGA through J2's mirrored v1.0 net map, UXGA saved to SD. 'D' on the
; console dumps the latest jpg as base64. See v1_probe.cpp for the full contract.
lib_ignore = lora_interface, leaf_detector
build_flags =
	${env.build_flags}
	-DLEAF_V1_PROBE
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DLEAF_CAM_PWR_GPIO=39
	-DLEAF_RADIO_PWR_GPIO=44

; --- custom leaf PCB (pilot, v0.5.x, JLC fab v6) -----------------------------------------
; Console is the S3's NATIVE USB (no UART bridge on the board): CDC flags below. Switched
; power rails (leaf_rails.h): IO39 camera, IO44 radio+microSD — firmware drives them LOW to
; power, and the board's pull-ups hold them OFF through deep sleep. SD is SPI mode CS=43 on
; the shared radio bus. BME280 module in J10 (I2C 40/41 @0x76). Battery divider on IO3.
; Radio = socketed Core1262 (same TCXO/profile as bench). Deep-sleep target: <50 uA.
[env:leaf-pcb]
build_flags =
	${env.build_flags}
	${radio.build_flags}
	${detector.build_flags}
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DRADIO_MISO_PIN=38
	-DLEAF_CAM_PWR_GPIO=39
	-DLEAF_RADIO_PWR_GPIO=44
	-DLEAF_SD_SPI_CS=43
	-DLEAF_VBAT_ADC_GPIO=3
	; env sensor: detected by chip-id at runtime (BME280 0x60 / BMP280 0x58 /
	; BME680 0x61) — see leaf_env.cpp. LEAF_BME280 is still accepted as the old name.
	-DLEAF_ENV
	-DLEAF_TEST_INTERVAL_S=20
	-DLEAF_STORE_MAX_FULL=64
lib_deps =
	${radio.lib_deps}
	${detector.lib_deps}
	${env_sensor.lib_deps}

[env:leaf-pcb-field]
build_flags =
	${env.build_flags}
	${radio.build_flags}
	${detector.build_flags}
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	; 14 dBm: perfboard-derived safe floor (leaf-tx-power.md). The PCB's power
	; path likely supports more — pending its own on-battery sweep.
	-DLORA_TX_DBM=14
	-DRADIO_MISO_PIN=38
	-DLEAF_CAM_PWR_GPIO=39
	-DLEAF_RADIO_PWR_GPIO=44
	-DLEAF_SD_SPI_CS=43
	-DLEAF_VBAT_ADC_GPIO=3
	-DLEAF_ENV
lib_deps =
	${radio.lib_deps}
	${detector.lib_deps}
	${env_sensor.lib_deps}

; --- custom leaf PCB v1.0 (batch 2) ------------------------------------------------------
; The first env that can actually USE a v1.0 board's radio. Three things differ from
; leaf-pcb, and all three are the v1.0 board, not a policy choice:
;
;   radio   RAK3172-T on UART2 (${radio_rak}), NOT an SX1262 on SPI. Before this env
;           existed, leaf_radio_begin() on a v1.0 board failed every wake with
;           "LoRa init failed, code -2" and the node transmitted nothing.
;   microSD SDMMC 1-bit on 47/48/38 (the bench assignment, now the routed
;           layout) instead of SPI with CS=43. Same leaf_store backend, different pins.
;   camera  unchanged — v1.0's J2 net map is mirrored in HARDWARE relative to v0.6, so
;           the leaf_board.h pin map is the same one v1-probe captured UXGA through.
;
; ⚠️ RADIO PROFILE IS THE LEGACY bw125 LADDER HERE, ON PURPOSE. It is what the bench
; gateway runs, so this env can talk to it and the end-to-end capture is testable
; today. The CERTIFIED build is -DLORA_PROFILE_BASE=LORA_PROFILE_CERT_BASE (bw500, the
; only bandwidth inside the RAK3172 grant) and switching is a FLAG DAY — a bw500 node and
; a bw125 node are mutually deaf, so every node reflashes together. That is a fleet-wide rollout, not
; this bead. Do not ship a v1.0 board at granted power on this env.
[env:leaf-pcb-v1]
build_flags =
	${env.build_flags}
	${radio_rak.build_flags}
	${detector.build_flags}
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DLEAF_CAM_PWR_GPIO=39
	-DLEAF_RADIO_PWR_GPIO=44
	-DLEAF_SD_CLK=47 -DLEAF_SD_CMD=48 -DLEAF_SD_D0=38
	-DLEAF_VBAT_ADC_GPIO=3
	-DLEAF_ENV
	-DLEAF_TEST_INTERVAL_S=20
	-DLEAF_STORE_MAX_FULL=64
	; Walk-up SoftAP + captive portal. On this env it is the WHOLE walk-up
	; path: leaf-pcb-v1 has no LEAF_BLE, so there is no discovery channel to hand off
	; from and no single-radio contention to arbitrate. It raises only inside a
	; maintenance window and dies with it. The other leaf envs opt in once the draw is
	; on an instrument; this one is a bench board on USB.
	-DLEAF_PORTAL
lib_deps =
	${radio_rak.lib_deps}
	${detector.lib_deps}
	${env_sensor.lib_deps}

; --- portal bench env — a TEST env, not a shipping one ------------------------------------
; leaf-pcb-v1 plus the flags that move this board's radio OFF the bench gateway's lane.
;
; WHY IT EXISTS. The stock leaf-pcb-v1 ladder is 903.0 sf8/bw125, which is deliberately the
; lane the bench gateway runs — and on 2026-09-03 that lane is carrying another session's
; command-downlink investigation with board 0016 and gw-home on it. A second leaf
; announcing into a live experiment is a collision, not a test. 903.9 sf8/bw500 @ 10 dBm is
; the lane board 0014 used on 2026-09-01 for exactly this reason: a bw500 node and a bw125
; node are mutually deaf, so this board is invisible to that bench and it to us.
;
; The radio is kept ON rather than compiled out because the node's wire identity — the slug
; the portal page and every announce carry — is the RNS destination hash, and a build with
; no radio has no identity to show. Testing the portal on a node calling itself
; "leaf-unidentified" would not be testing the product.
[env:leaf-pcb-v1-portal-bench]
extends = env:leaf-pcb-v1
build_flags =
	${env:leaf-pcb-v1.build_flags}
	-DLORA_FREQ_MHZ=903.9
	-DLORA_PROFILE_BASE=5           ; sf8/bw500, the certified ladder's near rung
	-DLEAF_RF_BASE_PROFILE=5        ; must track LORA_PROFILE_BASE (main.cpp)
	-DRAK_PREAMBLE_SYMS=8
	-DLORA_TX_DBM=10
lib_deps =
	${env:leaf-pcb-v1.lib_deps}

; --- BLE bench env — a TEST env, not a shipping one ---------------------------------------
; portal-bench plus the [ble] block: the full walk-up product path (BLE discover -> "wifi"
; command -> portal AP handoff) on real v1.0 PCB pins, for bringing up the mobile app
; against a v1 board. Same off-lane radio as portal-bench and for the same reason: the
; 903.0 sf8/bw125 lane is carrying the live downlink investigation, and a second
; announcing leaf there is a collision. BLE stays out of the shipping leaf-pcb-v1 env
; until the per-window draw is on an instrument.
[env:leaf-pcb-v1-ble-bench]
extends = env:leaf-pcb-v1-portal-bench
build_flags =
	${env:leaf-pcb-v1-portal-bench.build_flags}
	${ble.build_flags}
lib_deps =
	${env:leaf-pcb-v1-portal-bench.lib_deps}
