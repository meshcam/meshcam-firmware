; T-Internet-POE gateway envs — QUARANTINED config. Build with:
;
;   pio run -c platformio-poe.ini -e poe-gateway          (or poe-gateway-home / *-ota)
;
; WHY A SEPARATE FILE. These envs pin espressif32@6.9.0 (Arduino core 2.0.x) for the
; classic ETH.begin(addr,power,mdc,mdio,type,clk) signature the LAN8720 needs; every
; other env in this repo is on pioarduino (core 3.3.9). Both platforms want a package
; NAMED framework-arduinoespressif32 (and tool-esptoolpy), and PlatformIO gives each
; package name ONE directory per core dir — whichever family installs last claims it,
; and the next build of the other family PRUNES the loser and then fails with a FAKE
; compile error (FRAMEWORK_DIR TypeError: ... not 'NoneType' in arduino.py, or missing
; WCharacter.h / esp_arduino_version.h / io_pin_remap.h). Reproduced both ways
; 2026-08-29 and again 2026-09-08.
;
; The cure is the core_dir below: poe builds get their own package store,
; ~/.platformio-esp32-classic, so they can never evict (or be evicted by) the
; pioarduino family in ~/.platformio. That is also why these envs are NOT in
; platformio.ini — a plain `pio run -e poe-gateway` there would resolve them into the
; shared store and re-create the bug. If that command just told you "Unknown
; environment names", this file is what you were looking for.
;
; THE BOARD IS FROZEN (2026-08-29): the T-Internet-POE will not be flashed
; again; the S3+W5500 gateway PCB replaces it. When the tower swap lands,
; delete this file, [poe_common] hardware notes and the bridge-poe project — nothing
; else uses espressif32@6.9.0.
;
; Board + wiring notes (ESP32-WROOM + LAN8720 + hand-wired Core1262): see the
; [poe_common] comments below and docs/trailcam/hardware.md.

[platformio]
; The whole point of this file — see header. `~` expands on every OS.
core_dir = ~/.platformio-esp32-classic
; A bare `pio run -c platformio-poe.ini` builds only the two firmware envs, not the
; -ota upload variants (and not the heltec/s3 envs this file inherits via
; extra_configs — building THOSE into the classic store would waste 1 GB, though it
; could not evict anything).
default_envs = poe-gateway-home, poe-gateway
; platformio.ini supplies [env] + [gateway_common] (+ the pioarduino envs, unused
; here); secrets.ini supplies ${secrets.ota_auth} and feeds gen_gw_secrets.py.
extra_configs =
	platformio.ini
	secrets.ini

; ---------------- LILYGO T-Internet-POE (wired ethernet + PoE) --------------------------
;
; ESP32-WROOM (4MB flash) + LAN8720. Pinned to espressif32@6.x (Arduino core 2.0.x) on
; purpose: main.cpp uses the classic ETH.begin(addr,power,mdc,mdio,type,clk) signature
; (core 3.x changed the ETH API) — same pin map bridge-poe bench-proved 2026-06-30.
;
; SX1262 (Waveshare Core1262-HF) hand-wired per docs/trailcam/hardware.md (verified
; against the v1.0 schematic 2026-07-04): the RMII PHY owns 19/21/22/25/26/27 + MDC 23 /
; MDIO 18 + clock-out 17 + PHY reset 5, so the radio gets the free header pins below.
; 34/35/36 are input-only — fine for BUSY/MISO/DIO1 (all MCU inputs). DIO2 is the RF
; switch, DIO3 feeds the 1.8V TCXO (the GATE_B_WIRED_SX1262 board case handles both).
; First flash is USB via the LilyGo downloader board; after that, espota over ethernet.
[poe_common]
flags =
	${gateway_common.flags}
	-DGW_NET_ETH
	-DGATE_B_WIRED_SX1262
	-DRADIO_SCLK_PIN=33
	-DRADIO_MISO_PIN=35
	-DRADIO_MOSI_PIN=32
	-DRADIO_CS_PIN=4
	-DRADIO_RST_PIN=16
	-DRADIO_BUSY_PIN=34
	-DRADIO_DIO1_PIN=36
	-DDEFAULT_UDP_PORT=4242
	; Deep upload queue on the board's TF slot (gateway-0.15.0). SD_MMC 1-bit uses only
	; IO14/15/2, which is why it fits here and nowhere else: the LAN8720 is RMII (not SPI)
	; and the Core1262 owns its own SPI set, so the SD set was genuinely spare. Without
	; this the upload slot is DEPTH 1 and any outage longer than one capture interval
	; loses every frame but the newest. Heltec V3 has no card slot -> flag not set there,
	; and that build keeps the depth-1 behaviour byte for byte.
	-DGW_SD_QUEUE

; PoE gateway on the bench / at home. site=home (replaces heltec board #1).
[env:poe-gateway-home]
; RELEASE, not the repo-wide debug default (2026-08-08). The 4 MB map gives the app
; 0x1B0000 = 1,769,472 B and this firmware was already using 96.5% of it; adding the SD
; queue costs 67.6 KB (SD_MMC + esp_vfs_fat + FATFS + the driver) and overflowed it by
; 6 KB. -Og -> -Os buys 203 KB back (1,775,693 -> 1,567,857, 88.6%), which is the only
; option here that costs no capability: the alternative that also fit was dropping
; -DRNS_LOG_LEVEL=7 to NOTICE, and that would kill the runtime bump to RNS DEBUG on the
; exact board whose announce wedge needed it. Panic backtraces still decode (the ELF
; keeps its symbols), just with less line precision — if you are chasing one, rebuild
; this env with build_type = debug and -UGW_SD_QUEUE. Heltec envs stay on debug: their
; 8 MB map has room.
build_type            = release
framework             = arduino
platform              = espressif32@6.9.0
board                 = esp32dev
board_build.partitions = partitions_ota_4mb.csv
monitor_filters       = esp32_exception_decoder
build_flags =
	${poe_common.flags}
	'-DGW_SITE="home"'

; PoE gateway for the remote-site tower (site2). Same firmware, different slug.
[env:poe-gateway]
extends     = env:poe-gateway-home
build_flags =
	${poe_common.flags}
	'-DGW_SITE="site2"'

;   pio run -c platformio-poe.ini -e poe-gateway-home-ota -t upload --upload-port <board-ip>
[env:poe-gateway-home-ota]
extends         = env:poe-gateway-home
upload_protocol = espota
upload_flags    = --auth=${secrets.ota_auth}

[env:poe-gateway-ota]
extends         = env:poe-gateway
upload_protocol = espota
upload_flags    = --auth=${secrets.ota_auth}
