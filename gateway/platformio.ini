; Trail-cam GATEWAY — LoRa/RNS in, network + HTTPS out. No laptop in the data path.
;
;   leaf --915MHz RNS Resource--> THIS BOARD --WiFi or ethernet + HTTPS--> trailcam ingest
;
; Two board families, one firmware (src/main.cpp):
;   heltec-v3-*  — Heltec WiFi LoRa 32 V3: onboard SX1262 + OLED, WiFi uplink.
;   poe-*        — LILYGO T-Internet-POE: LAN8720 wired ethernet (onboard 802.3af PoE PD),
;                  hand-wired SX1262 (Waveshare Core1262) on the free GPIOs, no screen.
;                  Also exposes RNS-over-UDP on the wire (port 4242) for Python RNS peers.
;                  Boots fine with the radio absent (network-only) — wire it, reboot, done.
;
; Grown out of gate-a-resource's server role once Gate A passed (2026-07-03): same
; pinned microReticulum + vendored LoRaInterface + deadlock patch, plus a PERSISTENT
; NVS identity (so the destination hash baked into leaves NEVER rotates — reflash this
; board freely), network uplink, and a multipart POST per the docs/trailcam/ingest-api.md
; contract for every Resource that completes.
;
; Secrets + site-specific values (WiFi psk, ingest URL/token) live in secrets.ini
; (gitignored) — copy secrets.ini.example and fill it in. Build fails loudly if missing.
;
; They reach the compiler through the GENERATED, gitignored header src/gw_secrets.h
; (gen_gw_secrets.py, below), NOT as -D flags. As flags they sat on every compiler
; invocation's ARGV — readable by any user with ps, captured by anything that snapshots
; a process list, and echoed verbatim by a compiler error that quotes the failing
; command. That last one already burned the leaf on 2026-08-09; this is the gateway
; half. secrets.ini is still the single source of truth and the workflow is unchanged.

[platformio]
extra_configs = secrets.ini

[env]
monitor_speed = 115200
upload_speed  = 460800
; WAS debug until 2026-08-08, which cost 205 KB of flash for nothing. Measured on
; the poe-gateway (T-Internet-POE) image, the tightest target we ship:
;     debug   1,707,985 B  96.5% of the 4 MB layout's 1,769,472 B OTA slot
;     release 1,502,901 B  84.9%   -> headroom 61 KB becomes 266 KB
; 96.5% is not a theoretical problem: an OTA image that outgrows the slot is
; refused by Update.begin() on a gateway whose only access is a WG tunnel. The
; leaf and surveyor projects were always release (they simply never set this),
; so debug here was an artifact of gateway bring-up, not a decision.
;
; Debuggability is NOT what was being bought. esp32_exception_decoder still
; resolves backtraces from the .elf, which keeps its symbols either way; -Os
; only makes inlined frames less precise. The things this project actually
; debugs with -- the /debuglog ring, RNS_LOG_LEVEL=7 traces, the telemetry
; beats -- are untouched. Dropping RNS_LOG_LEVEL to 4 was measured too: it
; saves only 22 KB and blinds exactly those traces, so it was rejected.
build_type    = release
extra_scripts =
	pre:patch_microreticulum.py
	; secrets.ini -> src/gw_secrets.h before every compile. Keeps the WiFi
	; PSKs, the ingest token and the OTA password off the build command line.
	pre:gen_gw_secrets.py
build_flags =
	-Wall
	-Wno-missing-field-initializers
	-Wno-format
	-DRNS_USE_FS
	; RAM hashlist (2026-07-19): the persistent replay-guard store did TWO synchronous
	; flash writes per accepted packet INSIDE radio dispatch — latency stacked exactly
	; where contention losses live (and the leaf shares that LittleFS with the photo
	; ring; its compaction threw "Has open FD" unlink errors). Wear was fine (~century);
	; the fsyncs were not. Cost of RAM-only: a reboot forgets the replay window, so a
	; stale announce can reprocess ONCE post-boot — benign, handlers are idempotent.
	-DRNS_PERSIST_HASHLIST=0
	-DUSTORE_USE_UNIVERSALFS
	; compile-in DEBUG-capable RNS logging; runtime level set in main.cpp
	-DRNS_LOG_LEVEL=7
lib_deps =
	ArduinoJson@^7.4.2
	MsgPack@^0.4.2
	jgromes/RadioLib @ ^7.0.0
	https://github.com/attermann/Crypto.git
	https://github.com/attermann/microStore.git
	; pinned to the SHA Gate A validated on hardware
	https://github.com/attermann/microReticulum.git#c02b6e3d985567cced4450fb65902106ebda5a39

; Everything shared by every gateway EXCEPT the board and the site slug. The slug is
; the only per-instance difference (the display address is fetched from the backend by
; slug); GW_INGEST_URL/TOKEN come from secrets.ini via the generated src/gw_secrets.h.
[gateway_common]
flags =
	${env.build_flags}
	-Wextra
	-DMCU_ESP32
	-DMSGPACK_USE_BOOST=OFF
	; Gateways are mains/PoE powered — there is no battery reason to be quiet, and the
	; LoRaInterface.h default of 10 dBm is a DESK-BENCH setting (it exists so two radios
	; a metre apart don't saturate each other). Shipping it to the field left the gateway
	; whispering back at 10 dBm while the surveyor shouted at 20: a ~17 dB measured
	; asymmetry in which the DOWNLINK is the weak half, so the probe_ack is the first
	; thing to drop at range and the sender then records a FALSE failure (probe #27,
	; 2026-07-14 — gateway logged all 5308 bytes, the board logged ok=0, and the range
	; walk came home with a false negative). Match the surveyor at 20 dBm. SX1262 could do 22; 20 keeps the link
	; symmetric, which is what makes the ok flag mean something.
	-DLORA_TX_DBM=20
	; NO ${secrets.build_flags} here — see the header note. The secrets arrive via
	; the generated src/gw_secrets.h, which main.cpp includes first.

[heltec_common]
flags =
	${gateway_common.flags}
	-DBOARD_HELTEC_V3
	-DGW_HAS_OLED
	-DUSTORE_ENABLE_LOG

; ---------------- Heltec V3 (WiFi) ------------------------------------------------------

; Second gateway (board #2, dest 5b8cd66a...). site=<your-site>.
[env:heltec-v3-gateway]
framework             = arduino
platform              = espressif32
board                 = heltec_wifi_lora_32_V3
board_build.partitions = partitions_ota_8mb.csv
monitor_filters       = esp32_exception_decoder
build_flags =
	${heltec_common.flags}
	'-DGW_SITE="site2"'
lib_deps =
	${env.lib_deps}
	olikraus/U8g2@^2.36.5

; HOME gateway (board #1, dest 6d3d3467... — was b78747ea..., it rotated).
; Same firmware, site=home.
[env:heltec-v3-gateway-home]
extends     = env:heltec-v3-gateway
build_flags =
	${heltec_common.flags}
	'-DGW_SITE="home"'

; Network/OTA update targets. Same firmware; only the upload path changes. Pass the
; device IP on the CLI (over the WG tunnel):
;   pio run -e heltec-v3-gateway-ota      -t upload --upload-port <gateway-ip>
;   pio run -e heltec-v3-gateway-home-ota -t upload --upload-port <home-ip>
[env:heltec-v3-gateway-ota]
extends         = env:heltec-v3-gateway
upload_protocol = espota
upload_flags    = --auth=${secrets.ota_auth}

[env:heltec-v3-gateway-home-ota]
extends         = env:heltec-v3-gateway-home
upload_protocol = espota
upload_flags    = --auth=${secrets.ota_auth}

; ---------------- LILYGO T-Internet-POE (wired ethernet + PoE) --------------------------
;
; ESP32-WROOM (4MB flash) + LAN8720. Pinned to espressif32@6.x (Arduino core 2.0.x) on
; purpose: main.cpp uses the classic ETH.begin(addr,power,mdc,mdio,type,clk) signature
; (core 3.x changed the ETH API) — same pin map bridge-poe bench-proved 2026-06-30.
;
; SX1262 (Waveshare Core1262-HF) hand-wired per docs/trailcam/hardware.md (verified
; against the v1.0 schematic 2026-07-04): the RMII PHY owns 19/21/22/25/26/27 + MDC 23 /
; MDIO 18 + clock-out 17 + PHY reset 5, so the radio gets the free header pins below.
; 34/35/36 are input-only — fine for BUSY/MISO/DIO1 (all MCU inputs). DIO2 is the RF
; switch, DIO3 feeds the 1.8V TCXO (the GATE_B_WIRED_SX1262 board case handles both).
; First flash is USB via the LilyGo downloader board; after that, espota over ethernet.
[poe_common]
flags =
	${gateway_common.flags}
	-DGW_NET_ETH
	-DGATE_B_WIRED_SX1262
	-DRADIO_SCLK_PIN=33
	-DRADIO_MISO_PIN=35
	-DRADIO_MOSI_PIN=32
	-DRADIO_CS_PIN=4
	-DRADIO_RST_PIN=16
	-DRADIO_BUSY_PIN=34
	-DRADIO_DIO1_PIN=36
	-DDEFAULT_UDP_PORT=4242
	; Deep upload queue on the board's TF slot (gateway-0.15.0). SD_MMC 1-bit uses only
	; IO14/15/2, which is why it fits here and nowhere else: the LAN8720 is RMII (not SPI)
	; and the Core1262 owns its own SPI set, so the SD set was genuinely spare. Without
	; this the upload slot is DEPTH 1 and any outage longer than one capture interval
	; loses every frame but the newest. Heltec V3 has no card slot -> flag not set there,
	; and that build keeps the depth-1 behaviour byte for byte.
	-DGW_SD_QUEUE

; PoE gateway on the bench / at home. site=home (replaces heltec board #1).
[env:poe-gateway-home]
; RELEASE, not the repo-wide debug default (2026-08-08). The 4 MB map gives the app
; 0x1B0000 = 1,769,472 B and this firmware was already using 96.5% of it; adding the SD
; queue costs 67.6 KB (SD_MMC + esp_vfs_fat + FATFS + the driver) and overflowed it by
; 6 KB. -Og -> -Os buys 203 KB back (1,775,693 -> 1,567,857, 88.6%), which is the only
; option here that costs no capability: the alternative that also fit was dropping
; -DRNS_LOG_LEVEL=7 to NOTICE, and that would kill the runtime bump to RNS DEBUG on the
; exact board whose announce wedge needed it. Panic backtraces still decode (the ELF
; keeps its symbols), just with less line precision — if you are chasing one, rebuild
; this env with build_type = debug and -UGW_SD_QUEUE. Heltec envs stay on debug: their
; 8 MB map has room.
build_type            = release
framework             = arduino
platform              = espressif32@6.9.0
board                 = esp32dev
board_build.partitions = partitions_ota_4mb.csv
monitor_filters       = esp32_exception_decoder
build_flags =
	${poe_common.flags}
	'-DGW_SITE="home"'

; PoE gateway for the remote-site tower (site2). Same firmware, different slug.
[env:poe-gateway]
extends     = env:poe-gateway-home
build_flags =
	${poe_common.flags}
	'-DGW_SITE="site2"'

;   pio run -e poe-gateway-home-ota -t upload --upload-port <board-ip>
[env:poe-gateway-home-ota]
extends         = env:poe-gateway-home
upload_protocol = espota
upload_flags    = --auth=${secrets.ota_auth}

[env:poe-gateway-ota]
extends         = env:poe-gateway
upload_protocol = espota
upload_flags    = --auth=${secrets.ota_auth}

; ---------------- PRODUCTION gateway PCB: ESP32-S3 + W5500 SPI ethernet -----------------
;
; The custom gateway PCB (homelab docs/trailcam/gateway-pcb.md): ESP32-S3-
; WROOM-1-N16R8 + WIZnet W5500 SPI ethernet + SX1262 on its own SPI bus. Productizes the
; T-Internet-POE tower node (classic-ESP32 + LAN8720 RMII) onto the same S3 module the leaf
; uses. Same firmware (src/main.cpp) as every other gateway ABOVE the netif — RNS-over-UDP
; :4242, HTTPS ingest, OTA are socket-level and already proven; only the ethernet MAC/PHY
; changes (W5500 over SPI instead of LAN8720 over RMII).
;
; CORE VERSION IS THE POINT: SPI-ethernet (W5500) in the Arduino ETH API landed in
; arduino-esp32 3.x. PlatformIO's espressif32 platform is stuck on core 2.0.x, so this env
; uses the pioarduino platform fork (Espressif-endorsed community continuation), same as the
; gate-c-w5500-eth validation. The T-Internet-POE env (poe-gateway*) STAYS pinned to
; espressif32@6.x for the OLD ETH.begin(addr,power,mdc,mdio,type,clk) signature — LAN8720
; keeps working there. main.cpp selects the W5500 core-3.x ETH.begin via -DGW_NET_ETH_W5500.
;
; Pin map = gateway PCB GPIO draft, copied verbatim (gate-c-w5500-eth compile-proven; two
; SEPARATE SPI buses on purpose — RNS frame timing and W5500 DMA both hate arbitration):
;   W5500 (SPI3_HOST):  SCK 12  MISO 13  MOSI 11  CS 10  INT 9  RST 8
;   Radio (leaf PCB map, global SPI=FSPI/SPI2): SCK 47 MOSI 48 MISO 38 CS 14 RST 1 BUSY 2 DIO1 42
;
; HARDWARE-UNVALIDATED: this env is compile-only until the W5500 breakout bring-up
; passes on real hardware and the gateway PCB is fabbed. DO NOT flash a production node from
; it before then.
; ONE SKU, RUNTIME UPLINK. -DGW_NET_DUALSTACK compiles BOTH the W5500 wired path
; and the S3's native WiFi into one binary and lets the box choose at boot: ethernet is
; preferred and always preempts, WiFi is the fallback that makes a window-mounted consumer
; unit work on the same board. The single-transport gateways above are unaffected — they
; simply never define it, and the selector collapses to their old behaviour.
;
; A DEV build inherits the bench SSID from secrets.ini, so it falls back to the bench
; network and never reaches provisioning. A shipped consumer build must bake NO WiFi
; credential and rely on the provisioning path (undecided — homelab
; docs/trailcam/gateway-provisioning.md); the #error that demands baked creds is relaxed
; for dual-stack builds precisely so that is buildable.
[s3_gateway_common]
flags =
	${gateway_common.flags}
	-DGW_NET_ETH_W5500
	-DGW_NET_DUALSTACK
	-DBOARD_HAS_PSRAM
	; W5500 own SPI bus (SPI3_HOST) — gateway PCB GPIO draft
	-DETH_SCK_PIN=12 -DETH_MISO_PIN=13 -DETH_MOSI_PIN=11
	-DETH_CS_PIN=10  -DETH_INT_PIN=9   -DETH_RST_PIN=8
	; SX1262 on its own SPI bus = leaf PCB radio map
	-DGATE_B_WIRED_SX1262
	-DRADIO_SCLK_PIN=47 -DRADIO_MOSI_PIN=48 -DRADIO_MISO_PIN=38
	-DRADIO_CS_PIN=14 -DRADIO_RST_PIN=1 -DRADIO_BUSY_PIN=2 -DRADIO_DIO1_PIN=42
	-DDEFAULT_UDP_PORT=4242

; Production S3 gateway, remote-site tower slug. First flash USB, then espota over the tunnel.
[env:s3-gateway]
framework              = arduino
platform               = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board                  = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi      ; WROOM-1 N16R8 (octal PSRAM)
board_upload.flash_size = 16MB
board_build.partitions = partitions_ota_8mb.csv
monitor_filters        = esp32_exception_decoder
build_flags =
	${s3_gateway_common.flags}
	'-DGW_SITE="site2"'

; BENCH ONLY (2026-08-19): dual-stack failover test on the gate-c Freenove+W5500 rig.
; Own site slug so it cannot collide with the live gw-home Heltec in the cloud.
; Not for a production node. Delete or keep out of master as you prefer.
[env:s3-gateway-bench]
extends     = env:s3-gateway
build_flags =
	${s3_gateway_common.flags}
	'-DGW_SITE="bench"'

; Same board at home (replaces the bench poe-gateway-home). site=home.
[env:s3-gateway-home]
extends     = env:s3-gateway
build_flags =
	${s3_gateway_common.flags}
	'-DGW_SITE="home"'

;   pio run -e s3-gateway-ota      -t upload --upload-port <board-ip>
;   pio run -e s3-gateway-home-ota -t upload --upload-port <home-ip>
[env:s3-gateway-ota]
extends         = env:s3-gateway
upload_protocol = espota
upload_flags    = --auth=${secrets.ota_auth}

[env:s3-gateway-home-ota]
extends         = env:s3-gateway-home
upload_protocol = espota
upload_flags    = --auth=${secrets.ota_auth}


