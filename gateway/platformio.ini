; Trail-cam GATEWAY — LoRa/RNS in, network + HTTPS out. No laptop in the data path.
;
;   leaf --915MHz RNS Resource--> THIS BOARD --WiFi or ethernet + HTTPS--> trailcam ingest
;
; Two board families, one firmware (src/main.cpp):
;   heltec-v3-*  — Heltec WiFi LoRa 32 V3: onboard SX1262 + OLED, WiFi uplink.
;   poe-*        — LILYGO T-Internet-POE: LAN8720 wired ethernet (onboard 802.3af PoE PD),
;                  hand-wired SX1262 (Waveshare Core1262) on the free GPIOs, no screen.
;                  Also exposes RNS-over-UDP on the wire (port 4242) for Python RNS peers.
;                  Boots fine with the radio absent (network-only) — wire it, reboot, done.
;
; Grown out of gate-a-resource's server role once Gate A passed (2026-07-03): same
; pinned microReticulum + vendored LoRaInterface + deadlock patch, plus a PERSISTENT
; NVS identity (so the destination hash baked into leaves NEVER rotates — reflash this
; board freely), network uplink, and a multipart POST per the docs/trailcam/ingest-api.md
; contract for every Resource that completes.
;
; Secrets + site-specific values (WiFi psk, ingest URL/token) live in secrets.ini
; (gitignored) — copy secrets.ini.example and fill it in. Build fails loudly if missing.
;
; They reach the compiler through the GENERATED, gitignored header src/gw_secrets.h
; (gen_gw_secrets.py, below), NOT as -D flags. As flags they sat on every compiler
; invocation's ARGV — readable by any user with ps, captured by anything that snapshots
; a process list, and echoed verbatim by a compiler error that quotes the failing
; command. That last one already burned the leaf on 2026-08-09; this is the gateway
; half. secrets.ini is still the single source of truth and the workflow is unchanged.

[platformio]
extra_configs = secrets.ini

[env]
monitor_speed = 115200
upload_speed  = 460800
; WAS debug until 2026-08-08, which cost 205 KB of flash for nothing. Measured on
; the poe-gateway (T-Internet-POE) image, the tightest target we ship:
;     debug   1,707,985 B  96.5% of the 4 MB layout's 1,769,472 B OTA slot
;     release 1,502,901 B  84.9%   -> headroom 61 KB becomes 266 KB
; 96.5% is not a theoretical problem: an OTA image that outgrows the slot is
; refused by Update.begin() on a gateway whose only access is a WG tunnel. The
; leaf and surveyor projects were always release (they simply never set this),
; so debug here was an artifact of gateway bring-up, not a decision.
;
; Debuggability is NOT what was being bought. esp32_exception_decoder still
; resolves backtraces from the .elf, which keeps its symbols either way; -Os
; only makes inlined frames less precise. The things this project actually
; debugs with -- the /debuglog ring, RNS_LOG_LEVEL=7 traces, the telemetry
; beats -- are untouched. Dropping RNS_LOG_LEVEL to 4 was measured too: it
; saves only 22 KB and blinds exactly those traces, so it was rejected.
build_type    = release
extra_scripts =
	pre:patch_microreticulum.py
	; secrets.ini -> src/gw_secrets.h before every compile. Keeps the WiFi
	; PSKs, the ingest token and the OTA password off the build command line.
	pre:gen_gw_secrets.py
build_flags =
	-Wall
	-Wno-missing-field-initializers
	-Wno-format
	-DRNS_USE_FS
	; RAM hashlist (2026-07-19): the persistent replay-guard store did TWO synchronous
	; flash writes per accepted packet INSIDE radio dispatch — latency stacked exactly
	; where contention losses live (and the leaf shares that LittleFS with the photo
	; ring; its compaction threw "Has open FD" unlink errors). Wear was fine (~century);
	; the fsyncs were not. Cost of RAM-only: a reboot forgets the replay window, so a
	; stale announce can reprocess ONCE post-boot — benign, handlers are idempotent.
	-DRNS_PERSIST_HASHLIST=0
	-DUSTORE_USE_UNIVERSALFS
	; compile-in DEBUG-capable RNS logging; runtime level set in main.cpp
	-DRNS_LOG_LEVEL=7
lib_deps =
	ArduinoJson@^7.4.2
	MsgPack@^0.4.2
	jgromes/RadioLib @ ^7.0.0
	https://github.com/attermann/Crypto.git
	https://github.com/attermann/microStore.git
	; pinned to the SHA Gate A validated on hardware
	https://github.com/attermann/microReticulum.git#c02b6e3d985567cced4450fb65902106ebda5a39

; Everything shared by every gateway EXCEPT the board and the site slug. The slug is
; the only per-instance difference (the display address is fetched from the backend by
; slug); GW_INGEST_URL/TOKEN come from secrets.ini via the generated src/gw_secrets.h.
[gateway_common]
flags =
	${env.build_flags}
	-Wextra
	-DMCU_ESP32
	-DMSGPACK_USE_BOOST=OFF
	; Gateways are mains/PoE powered — there is no battery reason to be quiet, and the
	; LoRaInterface.h default of 10 dBm is a DESK-BENCH setting (it exists so two radios
	; a metre apart don't saturate each other). Shipping it to the field left the gateway
	; whispering back at 10 dBm while the surveyor shouted at 20: a ~17 dB measured
	; asymmetry in which the DOWNLINK is the weak half, so the probe_ack is the first
	; thing to drop at range and the sender then records a FALSE failure (probe #27,
	; 2026-07-14 — gateway logged all 5308 bytes, the board logged ok=0, and the range
	; walk came home with a false negative). Match the surveyor at 20 dBm. SX1262 could do 22; 20 keeps the link
	; symmetric, which is what makes the ok flag mean something.
	-DLORA_TX_DBM=20
	; NO ${secrets.build_flags} here — see the header note. The secrets arrive via
	; the generated src/gw_secrets.h, which main.cpp includes first.

[heltec_common]
flags =
	${gateway_common.flags}
	-DBOARD_HELTEC_V3
	-DGW_HAS_OLED
	-DUSTORE_ENABLE_LOG

; ---------------- Heltec V3 (WiFi) ------------------------------------------------------

; Second gateway (board #2, dest 5b8cd66a...). site=<your-site>.
[env:heltec-v3-gateway]
framework             = arduino
; EXACT pioarduino release (Arduino core 3.3.9 / IDF 5.5.4) — same pin as leaf/ and
; surveyor/ (see leaf/platformio.ini for why a bare `espressif32` is a trap).
platform              = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board                 = heltec_wifi_lora_32_V3
board_build.partitions = partitions_ota_8mb.csv
monitor_filters       = esp32_exception_decoder
build_flags =
	${heltec_common.flags}
	'-DGW_SITE="site2"'
lib_deps =
	${env.lib_deps}
	olikraus/U8g2@^2.36.5

; HOME gateway (board #1, dest 6d3d3467... — was b78747ea..., it rotated).
; Same firmware, site=home.
[env:heltec-v3-gateway-home]
extends     = env:heltec-v3-gateway
build_flags =
	${heltec_common.flags}
	'-DGW_SITE="home"'

; BENCH TEST RIG for the provisioning portal (step 8). NOT a shipping env.
;
; The portal only ever appears when the credential list is EMPTY, and every normal build
; inherits the bench SSID from secrets.ini, so on real hardware the state it exists for is
; unreachable. -DGW_PORTAL_BENCH empties the baked list in source (a -U flag cannot do it
; any more: the credentials now arrive via gw_secrets.h, and -U only undoes
; command-line -D), so the box boots straight into PROVISION, raises "meshcam-gw-XXXX" and
; serves the setup form. The OLED names the network to join, which is how you know it
; came up.
;
;   pio run -e heltec-v3-portal-bench -t upload && pio device monitor
;   then: join "meshcam-gw-XXXX" from a phone, expect the captive popup.
;
; What it proves: AP + captive redirect + scan list + save + join + claim-code entry + the
; AP dropping itself. What it does NOT prove: the ethernet preempt (no PHY on this board).
; A credential saved here is real and persists in NVS; `wifi clear` over serial undoes it,
; `claim clear` undoes a claim.
[env:heltec-v3-portal-bench]
extends     = env:heltec-v3-gateway
build_flags =
	${heltec_common.flags}
	'-DGW_SITE="home"'
	-DGW_PORTAL_BENCH

; Network/OTA update targets. Same firmware; only the upload path changes. Pass the
; device IP on the CLI (over the WG tunnel):
;   pio run -e heltec-v3-gateway-ota      -t upload --upload-port <gateway-ip>
;   pio run -e heltec-v3-gateway-home-ota -t upload --upload-port <home-ip>
[env:heltec-v3-gateway-ota]
extends         = env:heltec-v3-gateway
upload_protocol = espota
upload_flags    = --auth=${secrets.ota_auth}

[env:heltec-v3-gateway-home-ota]
extends         = env:heltec-v3-gateway-home
upload_protocol = espota
upload_flags    = --auth=${secrets.ota_auth}

; ---------------- LILYGO T-Internet-POE (wired ethernet + PoE) --------------------------
;
; NOT HERE — the poe-* envs live in platformio-poe.ini, on purpose:
;
;   pio run -c platformio-poe.ini -e poe-gateway
;
; They pin espressif32@6.9.0 (Arduino core 2.0.x, for the classic LAN8720 ETH.begin
; signature) while everything above and below is pioarduino core 3.3.9, and the two
; platforms fight over the SAME package directory (framework-arduinoespressif32,
; tool-esptoolpy). Building a poe env from this file used to evict the framework every
; other env needs and make the NEXT build fail with a fake compile error. The separate
; config gives the poe family its own package store (~/.platformio-esp32-classic) so
; neither side can ever evict the other. Full story in platformio-poe.ini's header.

; ---------------- PRODUCTION gateway PCB: ESP32-S3 + W5500 SPI ethernet -----------------
;
; The custom gateway PCB (homelab docs/trailcam/gateway-pcb.md): ESP32-S3-
; WROOM-1-N16R8 + WIZnet W5500 SPI ethernet + SX1262 on its own SPI bus. Productizes the
; T-Internet-POE tower node (classic-ESP32 + LAN8720 RMII) onto the same S3 module the leaf
; uses. Same firmware (src/main.cpp) as every other gateway ABOVE the netif — RNS-over-UDP
; :4242, HTTPS ingest, OTA are socket-level and already proven; only the ethernet MAC/PHY
; changes (W5500 over SPI instead of LAN8720 over RMII).
;
; CORE VERSION IS THE POINT: SPI-ethernet (W5500) in the Arduino ETH API landed in
; arduino-esp32 3.x. PlatformIO's espressif32 platform is stuck on core 2.0.x, so this env
; uses the pioarduino platform fork (Espressif-endorsed community continuation), same as the
; gate-c-w5500-eth validation. The T-Internet-POE env (poe-gateway*) STAYS pinned to
; espressif32@6.x for the OLD ETH.begin(addr,power,mdc,mdio,type,clk) signature — LAN8720
; keeps working there. main.cpp selects the W5500 core-3.x ETH.begin via -DGW_NET_ETH_W5500.
;
; Pin map = gateway PCB GPIO draft, copied verbatim (gate-c-w5500-eth compile-proven; two
; SEPARATE SPI buses on purpose — RNS frame timing and W5500 DMA both hate arbitration):
;   W5500 (SPI3_HOST):  SCK 12  MISO 13  MOSI 11  CS 10  INT 9  RST 8
;   Radio: see the two [s3_gw_radio_*] blocks below — the PRODUCTION board carries a
;   RAK3172-T on a UART, the gate-c bench rig a bare SX1262 on FSPI.
;   microSD (SDMMC 1-bit): CLK 15 CMD 16 D0 17, card detect IO21
;
; HARDWARE-UNVALIDATED: this env is compile-only until the v0.4 boards arrive (in
; production 2026-09-04, expected ~Sept 12-15). DO NOT flash a production node from it
; before then; the W5500 half is bench-proven but the board is not.
; ONE SKU, RUNTIME UPLINK. -DGW_NET_DUALSTACK compiles BOTH the W5500 wired path
; and the S3's native WiFi into one binary and lets the box choose at boot: ethernet is
; preferred and always preempts, WiFi is the fallback that makes a window-mounted consumer
; unit work on the same board. The single-transport gateways above are unaffected — they
; simply never define it, and the selector collapses to their old behaviour.
;
; A DEV build inherits the bench SSID from secrets.ini, so it falls back to the bench
; network and never reaches provisioning. A shipped consumer build must bake NO WiFi
; credential and rely on the provisioning path (undecided — homelab
; docs/trailcam/gateway-provisioning.md); the #error that demands baked creds is relaxed
; for dual-stack builds precisely so that is buildable.
[s3_gateway_common]
flags =
	${gateway_common.flags}
	-DGW_NET_ETH_W5500
	-DGW_NET_DUALSTACK
	-DBOARD_HAS_PSRAM
	; Route Serial to the chip's built-in USB, not UART0. This board has no USB-serial
	; chip: the USB-C socket goes straight to the S3's native peripheral, and UART0 only
	; reaches two bare test pads. Without these two flags the Arduino core leaves Serial
	; on UART0, so every Serial.print in this firmware goes out those pads and the board
	; looks silent over USB while the core's own error logs still arrive over the native
	; console. That asymmetry is confusing enough to cost a bring-up session, so it is
	; fixed here rather than per-env. The leaf sets the same pair in every one of its
	; environments; the gateway simply never did.
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	; W5500 own SPI bus (SPI3_HOST) — gateway PCB GPIO draft
	-DETH_SCK_PIN=12 -DETH_MISO_PIN=13 -DETH_MOSI_PIN=11
	-DETH_CS_PIN=10  -DETH_INT_PIN=9   -DETH_RST_PIN=8
	-DDEFAULT_UDP_PORT=4242
	; --- microSD upload queue ---------------------------------------------------------
	; Without this the upload slot is DEPTH 1: any outage longer than one capture
	; interval loses every frame but the newest. The v0.2+ board carries a push-push
	; socket with the 10k pull-ups on CMD/D0/DAT3 the T-Internet-POE's slot was missing,
	; so this is the first gateway that can actually host the queue properly.
	; SDMMC 1-bit on the S3 is GPIO-matrix routed, so sd_queue.inc calls
	; SD_MMC.setPins(CLK, CMD, D0) before begin() — the pins below are what it passes.
	-DGW_SD_QUEUE
	-DGW_SD_CLK=15 -DGW_SD_CMD=16 -DGW_SD_D0=17
	; Card detect: DM3AT switch A -> IO21 (10k pull-up), switch B -> GND. LOW = card in.
	; This is the line that stops SD_MMC.begin() from being called on an EMPTY slot,
	; where it busy-spins without yielding and starves IDLE0 into a TWDT reboot loop
	; (bench, 2026-08-09). The probe containment in sd_queue.inc stays regardless — CD
	; proves a card is PRESENT, not that it is sound.
	-DGW_SD_CD_PIN=21
	; --- OTA rollback -----------------------------------------------------------------
	; Defer the "this image is good" verdict from initArduino() to the moment the box is
	; actually on the network with espota listening (main.cpp, ota_mark_valid_once). An
	; image that boots but cannot be reached rolls back to the previous slot on the next
	; reboot, which is what turns two app slots into recovery rather than a re-flash path.
	; Only this board opts in; the boards already in the field keep what they were flashed
	; with. Requires CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE, which the pioarduino core-3.x
	; prebuilt has on.
	-DGW_OTA_ROLLBACK

; --- radio: the production board and the bench rig differ, and only here ------------------
; RAK3172-T on UART2, the v0.2+ production board (gateway-pcb.md GPIO map v0.2). The
; gateway PCB dropped the bare SX1262 on 2026-07-28 when the RAK3172 swap landed, and the
; gateway's lora_interface already carries the same Rak3172Modem backend the leaf proved on
; board 0014 (2026-09-01). Pins are the leaf's, because the two boards share them.
[s3_gw_radio_rak]
flags =
	-DLORA_BACKEND_RAK3172
	-DRAK_UART_TX_PIN=14 -DRAK_UART_RX_PIN=2
	-DRAK_NRST_PIN=1 -DRAK_BOOT0_PIN=42

; Bare SX1262 on the global SPI (FSPI/SPI2), leaf v0.6 radio map. THE BENCH RIG ONLY —
; the gate-c Freenove S3 + W5500 breakout + hand-wired Core1262 that the early bring-up
; ran on. No fabbed gateway board has this radio. Kept so that rig stays buildable.
[s3_gw_radio_sx1262]
flags =
	-DGATE_B_WIRED_SX1262
	-DRADIO_SCLK_PIN=47 -DRADIO_MOSI_PIN=48 -DRADIO_MISO_PIN=38
	-DRADIO_CS_PIN=14 -DRADIO_RST_PIN=1 -DRADIO_BUSY_PIN=2 -DRADIO_DIO1_PIN=42

; Production S3 gateway, remote-site tower slug. First flash USB, then espota over the tunnel.
[env:s3-gateway]
framework              = arduino
; Was the moving `stable` alias; pinned to the exact release the rest of the repo uses
; so a rebuild months later still gets the validated core.
platform               = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board                  = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi      ; WROOM-1 N16R8 (octal PSRAM)
board_upload.flash_size = 16MB
board_build.partitions = partitions_ota_8mb.csv
monitor_filters        = esp32_exception_decoder
build_flags =
	${s3_gateway_common.flags}
	${s3_gw_radio_rak.flags}
	'-DGW_SITE="site2"'

; BENCH ONLY (2026-08-19): dual-stack failover test on the gate-c Freenove+W5500 rig.
; Own site slug so it cannot collide with the live gw-home Heltec in the cloud.
; Not for a production node. Delete or keep out of master as you prefer.
; The SX1262 map is what makes this the BENCH env now: that rig has a
; hand-wired Core1262 where the fabbed board has a RAK3172. It also has no card slot, so
; the SD flags above are inert on it — with nothing wired to IO21 the pull-up reads HIGH,
; card detect says SLOT EMPTY, and the mount is never attempted.
[env:s3-gateway-bench]
extends     = env:s3-gateway
build_flags =
	${s3_gateway_common.flags}
	${s3_gw_radio_sx1262.flags}
	'-DGW_SITE="bench"'

; Same board at home (replaces the bench poe-gateway-home). site=home.
[env:s3-gateway-home]
extends     = env:s3-gateway
build_flags =
	${s3_gateway_common.flags}
	${s3_gw_radio_rak.flags}
	'-DGW_SITE="home"'

;   pio run -e s3-gateway-ota      -t upload --upload-port <board-ip>
;   pio run -e s3-gateway-home-ota -t upload --upload-port <home-ip>
[env:s3-gateway-ota]
extends         = env:s3-gateway
upload_protocol = espota
upload_flags    = --auth=${secrets.ota_auth}

[env:s3-gateway-home-ota]
extends         = env:s3-gateway-home
upload_protocol = espota
upload_flags    = --auth=${secrets.ota_auth}

; ---------------- FCC certified-config gateway (bw500 DTS, RAK3172 grant) ---------------
; Opt-in build that pins the radio to the 15.247-certifiable envelope, so a shipped
; gateway stays inside the RAK3172 grant (2AF6B-RAK3172) the product rides. Detail:
; homelab docs/trailcam/fcc-certification.md.
;
; ONE FLAG DOES IT. LORA_PROFILE_BASE=4 is sf10/bw500, the rendezvous rung of the
; certified ladder (lora_profiles.h idx 3-5, appended 2026-08-07). The ADR loop already
; clamps itself to ONE profile family off that base — GW_RF_FAMILY_MIN/MAX in main.cpp
; resolve to [3,5] for any base above 2 — so the grant loop structurally cannot hand a
; leaf a sub-500 kHz rung. The draft's separate LORA_PROFILE_MIN/MAX clamps are gone on
; purpose: that mechanism was superseded by the family clamp and no longer exists.
;
; POWER IS NOT CUT HERE, and that is the change from the 2026-07-20 draft. That draft
; capped TX at 8 dBm because the board rode the E22-900M22S grant (<=8.8 dBm conducted).
; The gateway PCB took the RAK3172 on 2026-07-28, and its grant is 24.1 dBm DTS across
; 903-914.2 MHz, so the repo-wide 20 dBm is already inside the envelope with room. The
; caveat survives the module swap: register dBm != conducted dBm on this board's RF path,
; so a MEASURED conducted number is still owed before anything ships on this env.
;
; The drafted poe-gateway-cert env went to 22 dBm, the grant ceiling. This env does
; not follow it up there. 20 dBm is the number gateway_common picked to keep the link
; SYMMETRIC with the leaf, which is what makes a probe_ack failure mean something (see the
; LORA_TX_DBM note above); 2 dB of extra downlink buys nothing and unbalances that. Raising
; it is a decision for the measured-conducted work, not a default.
;
; The default channel is fine as is: LORA_FREQ_MHZ defaults to 903.0, the bottom center of
; the grant's 500 kHz uplink grid (903.0 ... 914.2 at 1.6 MHz spacing).
;
; FLAG DAY. A cert gateway (bw500) and a leaf still on bw125 are mutually deaf. Every node
; reflashes together or the mesh splits in two; that coordination is a fleet-wide rollout, not this env.
[env:s3-gateway-cert]
extends     = env:s3-gateway
build_flags =
	${s3_gateway_common.flags}
	${s3_gw_radio_rak.flags}
	'-DGW_SITE="site2"'
	-DLORA_PROFILE_BASE=4          ; sf10/bw500 — the certified ladder's rendezvous rung
